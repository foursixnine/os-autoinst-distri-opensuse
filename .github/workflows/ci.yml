name: ci
# yamllint disable-line rule:truthy
on: [push, pull_request]
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    name: "CI: Running ${{ matrix.test }} tests${{ matrix.name-suffix }} with perl v${{ matrix.perl-version }}"
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        include:
          - test: static
            perl-version: '5.40'
          - test: unit
            perl-version: '5.40'
          - test: compile-changed
            perl-version: '5.40'
          - test: compile
            perl-version: '5.40'
            shard: 0
            shards: 4
            name-suffix: ' (1/4)'
          - test: compile
            perl-version: '5.40'
            shard: 1
            shards: 4
            name-suffix: ' (2/4)'
          - test: compile
            perl-version: '5.40'
            shard: 2
            shards: 4
            name-suffix: ' (3/4)'
          - test: compile
            perl-version: '5.40'
            shard: 3
            shards: 4
            name-suffix: ' (4/4)'
          - test: compile-os-autoinst
            perl-version: '5.40'
          - test: check-strict
            perl-version: '5.42'
    container:
      image: perl:${{ matrix.perl-version }}-trixie
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v6
    - name: Install dependencies
      run: |
        apt-get -y update
        apt-get -y install libdbus-1-dev libssh2-1-dev libxml2-dev parallel python3-dev python3-yaml python3-jsonnet python3-jsonschema liblua5.3-dev yamllint
        # FFI needs cargo (newer than the packaged version)
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
    - name: Cache Perl dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4
      with:
        path: |
          /usr/local/lib/perl5
          /usr/local/share/perl
          /usr/local/bin
        # ci.yml is part of the key as it pins extra modules such as Perl::Tidy
        key: ci-perl-${{ matrix.perl-version }}-${{ hashFiles('cpanfile', '.github/workflows/ci.yml') }}
        restore-keys: |
          ci-perl-${{ matrix.perl-version }}-
    - name: Setup perl
      env:
        INLINE_PYTHON_EXECUTABLE: /usr/bin/python3
      run: |
        # Prefix with space to bypass ./tools/update_spec
        echo " requires 'Code::DRY';" >> cpanfile
        echo " requires 'Code::TidyAll';" >> cpanfile
        echo " requires 'Date::Parse';" >> cpanfile
        echo " requires 'List::Compare';" >> cpanfile
        echo " requires 'Regexp::Common';" >> cpanfile
        echo " requires 'Syntax::Keyword::Try';" >> cpanfile
        echo " requires 'Perl::Tidy', '== 20260826';" >> cpanfile
        . "$HOME/.cargo/env"
        make prepare
    - name: Run ${{ matrix.test }} tests
      env:
        TESTS: ${{ matrix.test }}
        COMPILE_SHARD: ${{ matrix.shard || '0' }}
        COMPILE_SHARDS: ${{ matrix.shards || '1' }}
      run: |
        # Work around https://github.com/actions/checkout/issues/766
        git config --global --add safe.directory "$GITHUB_WORKSPACE"
        git fetch origin master
        make test
